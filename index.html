<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex website</title>
     <style>
        .container{
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            
            
            
        }
        .cards{
            background-color: rgb(174, 253, 253);
            padding: 25px;
            border-radius: 24px;
            text-align: center;
            font-family: Arial;
            flex: 1;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: 0 4px 8px gray;
            
        }
        .cards:hover{
            background-color: rgb(250, 250, 195);
            transform: translateY(-5px);
        }

     </style>
</head>
<body>
    <div class="container">
        <div class="cards"> 
            <h4>HTML</h4>
            <p>Page structure</p>
            
        </div>
        <div class="cards">
            <h4>Css</h4>
            <p>Page styling</p>
        </div>
        <div class="cards">
            <h4>AI</h4>
            <p>Future learning</p>
        </div>
    </div>
</body>
</html>
